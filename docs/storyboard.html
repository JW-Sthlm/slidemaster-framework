<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slidemaster Framework Storyboard Demo</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --bg: #f1f3f2; --surface: #fff; --text: #1d2528; --muted: #657076; --accent: #24756f; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; }
    header, main { width: min(76rem, 100%); margin: auto; padding: 2rem; }
    header h1 { margin-bottom: 0.4rem; }
    header p { margin-top: 0; color: var(--muted); }
    article { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 1rem; border-radius: 1rem; background: var(--surface); overflow: hidden; }
    .preview, .notes { padding: 2rem; }
    .preview { background: #f8f6f1; }
    .preview small, .notes h3 { color: var(--accent); font-weight: 800; letter-spacing: 0.08em; }
    .preview h2 { font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1; }
    .notes { border-left: 1px solid #d8dedc; }
    .notes p { color: var(--muted); line-height: 1.6; }
    a { color: var(--accent); }
    @media (max-width: 700px) { article { grid-template-columns: 1fr; } .notes { border-left: 0; border-top: 1px solid #d8dedc; } }
  </style>
</head>
<body>
  <header>
    <a href="index.html">Back to deck demo</a>
    <h1>Storyboard demo</h1>
    <p>Slide intent and speaker notes stay visible together.</p>
  </header>
  <main id="storyboard"></main>
  <script type="application/json" id="deck-spec">
  {
    "slides": [
      {
        "heading": "Start with the story",
        "label": "Opening",
        "timing": "1m",
        "say": "A deck becomes easier to build when the central claim is clear.",
        "do": "Pause after the title."
      },
      {
        "heading": "Build from structured content",
        "label": "Model",
        "timing": "2m",
        "say": "The deck specification separates editorial decisions from presentation code.",
        "do": "Connect each card to the workflow."
      },
      {
        "heading": "Clone, validate, adapt",
        "label": "Close",
        "timing": "1m",
        "say": "Use the example, run the checks, then replace the content with your own.",
        "do": "End with the repository link."
      }
    ]
  }
  </script>
  <script>
    const spec = JSON.parse(document.getElementById("deck-spec").textContent);
    const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    })[character]);
    document.getElementById("storyboard").innerHTML = spec.slides.map((slide, index) => `
      <article>
        <section class="preview">
          <small>${String(index + 1).padStart(2, "0")} / ${escapeHtml(slide.label)}</small>
          <h2>${escapeHtml(slide.heading)}</h2>
        </section>
        <section class="notes">
          <small>${escapeHtml(slide.timing)}</small>
          <h3>DO</h3><p>${escapeHtml(slide.do)}</p>
          <h3>SAY</h3><p>${escapeHtml(slide.say)}</p>
        </section>
      </article>
    `).join("");
  </script>
</body>
</html>
